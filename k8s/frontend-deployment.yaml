apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-frontend-deployment
  namespace: default
spec:
  replicas: 2
  
  strategy:
    type: RollingUpdate # 롤링 파트
    rollingUpdate:
      maxSurge: 1     
      maxUnavailable: 0 
      
  selector:
    matchLabels:
      app: lms-frontend
  template:
    metadata:
      labels:
        app: lms-frontend
    spec:
      containers: # image aws_account_id: 변경사항 확인해보기, back도
      - name: frontend-container
        image: 879772956301.dkr.ecr.us-east-1.amazonaws.com/lms-frontend:latest
        
        ports:
        - containerPort: 80

        envFrom:
        - configMapRef:
            name: lms-frontend-config