apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-frontend-deployment
  namespace: default
spec:
  # replicas 미지정: HPA(lms-frontend-deployment)가 Pod 수(2~10)를 관리.
  # 여기에 명시하면 배포(apply)마다 HPA가 키운 replica가 그 값으로 리셋됨.
  strategy:
    type: RollingUpdate # 롤링 파트
    rollingUpdate:
      maxSurge: 1     
      maxUnavailable: 0 
      
  selector:
    matchLabels:
      app: lms-frontend
  template:
    metadata:
      labels:
        app: lms-frontend
    spec:
      containers: # image aws_account_id: 변경사항 확인해보기, back도
      - name: frontend-container
        image: 879772956301.dkr.ecr.us-east-1.amazonaws.com/lms-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80

        envFrom:
        - configMapRef:
            name: lms-frontend-config