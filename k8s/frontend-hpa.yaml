apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lms-frontend-deployment
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lms-frontend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50      # Pod 평균 CPU 50% 초과 시 스케일아웃
